<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checklist</title>
    <link rel="stylesheet" href="/style.css">
</head>
<body>
    <main>
        <h1>My Checklist</h1>
        <form id="form-task">
            <label for="new-task">New task</label>
            <input type="text" id="new-task" name="task" placeholder="Enter a task" required>
            <button type="submit">Add task</button>
        </form>
        <p id="storage-message" role="status"></p>
        <ul id="list-task"></ul>
    </main>
    <script type="module" src="/script.js"></script>
</body>
</html>
